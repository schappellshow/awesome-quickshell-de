# The normal look: shadows, fades, blur, inactive transparency.
#
# Every per-window exception is a rule below, not an old-style
# shadow-exclude / opacity-rule / fade-exclude / blur-background-exclude /
# rounded-corners-exclude option: picom 13 ignores those as soon as `rules`
# exists. When several rules match a window, the LAST one that sets a
# property wins (checked against picom 13: of two matching opacity rules the
# second one's value showed). So general rules come first and the exceptions
# after them, which is why the focus rules are at the top of the list.
#
# Conditions: the old `_NET_WM_STATE@:32a *= '..._FULLSCREEN'` and
# `_GTK_FRAME_EXTENTS@:c` spellings are deprecated (picom 13 warns that the
# type and format letters are ignored); the same tests are written without
# them, and fullscreen uses picom's own `fullscreen` predicate.

# ── Shadows ────────────────────────────────────────────────────────────────
# These are the FOCUSED window's shadow: wide, soft and dark, so the window
# you are working in lifts off the desktop. Unfocused windows keep the same
# shape in a paler colour (rules at the end), so they sit flatter. picom
# 13 can only vary a shadow's colour and on/off per window, not its radius
# or opacity, which is why "flatter" is done with colour.
shadow = true;
shadow-radius = 28;
shadow-offset-x = -16;
shadow-offset-y = -12;
shadow-opacity = 0.75;
shadow-color = "#000000";

# ── Blur ───────────────────────────────────────────────────────────────────
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;

# ── Window rules ───────────────────────────────────────────────────────────
# Inactive windows are 92% opaque (the old inactive-opacity); the focused
# one is fully opaque. Rofi, the bar and fullscreen windows are always 100%.
rules = (
    # Focus lift, first so every exception below overrides it. The shadow
    # colour is the whole difference between focused and not: a pale grey
    # shadow is weaker than black on any background and, on a dark one,
    # vanishes rather than glowing. Inactive windows are 92% opaque.
    {
        match = "focused";
        opacity = 1.0;
    },
    {
        match = "!focused";
        opacity = 0.92;
        shadow-color = "#404040";
    },

    # Surfaces that animate by themselves, or must be instant, get no
    # window animations (the preset in anim-*.conf applies to the rest): the
    # bar and every other quickshell surface (named "quickshell"), rofi,
    # notifications and popups, and fullscreen windows.
    {
        match = "name = 'quickshell' || class_g = 'Rofi' || name = 'Notification' || window_type = 'dock' || window_type = 'desktop' || window_type = 'notification' || window_type = 'tooltip' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'dnd' || fullscreen";
        # An empty list would fall through to the preset, so give them one
        # that changes nothing: a 1 ms "animation" that holds the opacity.
        animations = (
            {
                triggers = ["open", "show", "close", "hide", "geometry"];
                opacity = {
                    duration = 0.001;
                    start = "window-raw-opacity";
                    end = "window-raw-opacity";
                };
            },
        );
    },

    # Fullscreen windows: no rounded corners, no shadow, no transparency.
    {
        match = "fullscreen";
        corner-radius = 0;
        shadow = false;
        opacity = 1.0;
    },
    # Rofi and the bar: opaque, square, flat.
    {
        match = "class_g = 'Rofi'";
        corner-radius = 0;
        shadow = false;
        opacity = 1.0;
    },
    {
        match = "window_type = 'dock'";
        corner-radius = 0;
        opacity = 1.0;
        shadow = false;
        clip-shadow-above = true;
        # The quickshell bar is a transparent dock; blurring it painted a
        # frosted strip with a visible edge. Unblurred, only the opaque
        # pills show — free-floating widget look.
        blur-background = false;
    },
    {
        match = "window_type = 'desktop'";
        corner-radius = 0;
        shadow = false;
        blur-background = false;
    },
    # Notification popups, conky, drag icons: no shadow.
    {
        match = "name = 'Notification' || class_g = 'Conky' || window_type = 'notification' || window_type = 'dnd'";
        shadow = false;
    },
    # Client-side-decorated GTK windows draw their own shadow and shape.
    {
        match = "_GTK_FRAME_EXTENTS@";
        shadow = false;
        blur-background = false;
    },
    {
        match = "class_g = 'slop'";
        blur-background = false;
    },

    # Menus, dropdowns and tooltips (were the wintypes section). They are
    # never focused, so the !focused rule above would make them 92% opaque,
    # which is too solid for the blur behind them to read; these come after
    # it and set their own. 0.85 is where the frosted-glass look shows while
    # text stays easy to read. A menu keeps the dark shadow, not the pale
    # unfocused one.
    {
        match = "window_type = 'tooltip'";
        fade = true;
        shadow = false;
        opacity = 0.85;
        focus = true;
    },
    {
        match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'combo'";
        opacity = 0.85;
        shadow = true;
        shadow-color = "#000000";
    },
    # Awesome's own menus (desktop right-click, start button) draw a
    # translucent background themselves (theme.lua menu_bg_normal), so the
    # window stays fully opaque: blur shows through, text stays crisp.
    {
        match = "class_g = 'awesome' && window_type = 'popup_menu'";
        opacity = 1.0;
        blur-background = true;
    },

    # Quickshell surfaces draw their own translucency, so neither focus
    # rule applies to them (the bar and popups are never "focused" and would
    # all be dimmed to 92%). Last of the opacity rules, so it wins.
    {
        match = "name = 'quickshell' || window_type = 'dock'";
        opacity = 1.0;
    },

    # Opt-in blur for quickshell surfaces. The dock rule above turns blur off
    # for every quickshell window (the bar looked wrong frosted); a surface
    # that wants it asks by carrying the _AQS_BLUR property, set from
    # common/BlurHint.qml through modules/blur.lua. The number picks the
    # corner radius so the blur follows the surface's own rounded shape:
    #   1 = 10 px   2 = 16 px   3 = 24 px   4 = square   5 = round (the ring)
    # These must come after the dock rule.
    {
        match = "_AQS_BLUR@ = 1";
        blur-background = true;
        corner-radius = 10;
    },
    {
        match = "_AQS_BLUR@ = 2";
        blur-background = true;
        corner-radius = 16;
    },
    {
        match = "_AQS_BLUR@ = 3";
        blur-background = true;
        corner-radius = 24;
    },
    {
        match = "_AQS_BLUR@ = 4";
        blur-background = true;
        corner-radius = 0;
    },
    {
        match = "_AQS_BLUR@ = 5";
        blur-background = true;
        corner-radius = 130;
    },
);
