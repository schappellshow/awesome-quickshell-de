# Performance mode: the compositor does as little as it can.
#
# No blur, no shadows, no fades or animations (anim-off.conf is paired with
# this file), no inactive-window transparency, and a fullscreen window is
# unredirected — drawn straight to the screen, bypassing the compositor.
# Rounded corners stay so windows keep awesome's shape.
#
# Same rule as fx-normal.conf: no old-style *-exclude options next to
# `rules`.

shadow = false;
blur-method = "none";
unredir-if-possible = true;

# No inactive-opacity / inactive-dim / wintypes either: with `rules` present
# picom ignores them and warns. Windows keep their own opacity (inactive
# ones are not made transparent, which is the point), and a tooltip needs no
# special treatment without shadows or fades.
rules = (
    {
        match = "fullscreen || class_g = 'Rofi' || window_type = 'dock' || window_type = 'desktop'";
        corner-radius = 0;
    },
);
