# Window animations: Lively. Longer animations with more movement: windows
# grow in from well below full size and settle with a longer glide when the
# layout moves or resizes them. Structure and exclusions as anim-subtle.conf.
fading = false;

animations = (
    {
        triggers = ["open", "show"];
        preset = "appear";
        scale = 0.8;
        duration = 0.3;
    },
    {
        triggers = ["close", "hide"];
        preset = "disappear";
        scale = 0.8;
        duration = 0.25;
    },
    {
        triggers = ["geometry"];
        preset = "geometry-change";
        duration = 0.4;
    },
    {
        triggers = ["increase-opacity", "decrease-opacity"];
        opacity = {
            duration = 0.2;
            start = "window-raw-opacity-before";
            end = "window-raw-opacity";
        };
        shadow-opacity = "opacity";
    },
);
