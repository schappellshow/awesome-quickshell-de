# Window animations: Subtle. Short fades with a small scale, and a quick
# glide when the layout moves or resizes a window.
#
# Triggers: open/close = a window is created/destroyed; show/hide = it is
# mapped/unmapped without being destroyed, which is what a tag switch does;
# geometry = the layout moved or resized it. Each trigger takes the first
# entry that matches, so the exclusions (surfaces that animate on their
# own, or must be instant) come first as entries with no animation.
#
# Excluded: the bar and every other quickshell surface (named "quickshell"),
# rofi, notifications, docks, and fullscreen windows.
fading = false;

animations = (
    {
        triggers = ["open", "show"];
        preset = "appear";
        scale = 0.96;
        duration = 0.16;
    },
    {
        triggers = ["close", "hide"];
        preset = "disappear";
        scale = 0.96;
        duration = 0.12;
    },
    {
        triggers = ["geometry"];
        preset = "geometry-change";
        duration = 0.18;
    },
    {
        # Focus changes the window's opacity (inactive-opacity): fade it.
        triggers = ["increase-opacity", "decrease-opacity"];
        opacity = {
            duration = 0.12;
            start = "window-raw-opacity-before";
            end = "window-raw-opacity";
        };
        shadow-opacity = "opacity";
    },
);
