# Settings every variant shares.

# ── Backend ────────────────────────────────────────────────────────────────
# glx is required for dual_kawase blur. Fall back to "xrender" + remove
# blur section if you see a black screen or driver errors.
backend = "glx";
vsync = true;
glx-copy-from-front = false;
# Fixes newly-mapped windows briefly rendering blank/garbled under GLX —
# the main monitor's heavier compositing load (bar, blur, many windows)
# made this show up there specifically (e.g. notification popups).
xrender-sync-fence = true;

# ── Rounded corners ────────────────────────────────────────────────────────
# Must match theme.lua border_radius = dpi(10).
# At HiDPI (192 DPI) dpi(10) = 20 — update this value to match.
# (The per-window exclusions live in the fx-*.conf rules.)
corner-radius = 10;
