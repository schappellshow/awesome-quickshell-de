# Picom compositor — Awesome WM / OpenMandriva
#
# This file only assembles the config from parts, so the shell can swap the
# parts at runtime (Settings → Windows: animation preset, performance mode)
# without editing anything tracked in the repo:
#
#   base.conf          always: backend, vsync, corner radius
#   fx-normal.conf     normal look: shadows, blur, transparency, window rules
#   fx-performance.conf performance mode: all of that off, fullscreen unredirected
#   anim-<preset>.conf window animations: off | subtle | lively
#
# This file is what awesome starts picom with (autostart.lua), and it is
# the shipped default: normal look, Subtle animations. bin/.local/bin/
# picom-effects builds the same thing out of other part files when the
# choice changes, and restarts the picom of the CURRENT display only.
#
# libconfig refuses a setting that appears twice, and picom's `rules` list
# replaces every old-style *-exclude / opacity-rule option, so each setting
# lives in exactly one part per variant. Keep it that way when editing.

@include "base.conf"
@include "fx-normal.conf"
@include "anim-subtle.conf"
